<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05080d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VFIT PRO"><link rel="apple-touch-icon" href="../icon-premium-192.png"><title>VFIT PRO — 5 días</title><style>:root{--bg:#05080d;--line:#223244;--text:#f7f8fb;--muted:#91a0ae;--orange:#ff8a16;--green:#58e36c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#14263b 0,#07111b 30%,#05080d 62%)}button,input,select{font:inherit}.app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 28px)}header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 12px}.brand{font-weight:1000;font-style:italic;font-size:23px;letter-spacing:-.04em}.brand span{color:var(--orange)}.week{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.week select{border:1px solid var(--line);background:#0d1823;color:#fff;border-radius:12px;padding:9px 10px;font-weight:900}.restNote{margin:0 2px 12px;padding:9px 11px;border:1px solid #243549;background:#09121b;border-radius:13px;color:#c9d3dd;font-size:11px}.restNote b{color:var(--orange)}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px}.days button{border:1px solid var(--line);background:#0a121b;color:#9eacba;border-radius:13px;padding:11px 2px;font-weight:1000}.days button.active{background:linear-gradient(135deg,#ffad2e,var(--orange));color:#111;border-color:transparent}.title{margin:0 2px 11px}.title h1{font-size:27px;margin:0;letter-spacing:-.04em}.title p{font-size:12px;color:var(--muted);margin:4px 0 0}.exercise{border:1px solid var(--line);background:linear-gradient(180deg,#0d1721,#09111a);border-radius:20px;overflow:hidden;margin-bottom:11px;box-shadow:0 12px 26px #0006}.photoBtn{display:block;width:100%;padding:0;border:0;background:#071018;position:relative}.photoBtn img{display:block;width:100%;aspect-ratio:1.65/1;object-fit:cover}.zoom{position:absolute;right:10px;bottom:10px;background:#05080dcc;border:1px solid #526579;border-radius:999px;padding:6px 9px;color:#fff;font-size:10px;font-weight:900}.body{padding:11px}.exTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.exName{font-weight:1000;font-size:15px;line-height:1.2}.target{color:var(--orange);font-size:11px;font-weight:1000;white-space:nowrap}.cue{margin:6px 0 10px;color:#bec9d4;font-size:11px;line-height:1.35}.fields{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}.fields input{width:100%;border:1px solid #2b3e51;background:#101b27;color:#fff;border-radius:12px;padding:11px 10px;font-size:14px;outline:none}.fields input:focus{border-color:var(--orange)}.hint{font-size:11px;color:var(--muted);text-align:center;padding:6px 4px}.saved{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,12px);opacity:0;background:#12331a;color:var(--green);border:1px solid #285f34;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:1000;pointer-events:none;transition:.18s;z-index:10}.saved.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:99;padding:14px}.modal.show{display:flex}.modal img{max-width:100%;max-height:88vh;border-radius:18px}.close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:44px;height:44px;border-radius:50%;border:1px solid #536274;background:#101821;color:#fff;font-size:24px}.modalName{position:absolute;left:16px;right:70px;bottom:calc(env(safe-area-inset-bottom) + 18px);font-size:13px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}</style></head><body><div class="app"><header><div class="brand">VFIT <span>PRO</span></div><label class="week">SEMANA <select id="week"></select></label></header><div class="restNote"><b>5 días de pesas</b> · descanso miércoles y domingo · cada grupo recibe 2 estímulos semanales.</div><div class="days" id="days"></div><div class="title"><h1 id="dayTitle"></h1><p id="daySub"></p></div><div id="list"></div><div class="hint">Toca una imagen para verla grande. Escribe peso y reps; se guarda automáticamente en este iPhone.</div></div><div class="saved" id="saved">✓ GUARDADO</div><div class="modal" id="modal"><button class="close" id="close">×</button><img id="modalImg" alt="Ejercicio"><div class="modalName" id="modalName"></div></div><script>const P='../assets/exercises/premium/',V='?v=509';const DAYS=[{key:'upperA',short:'L',title:'Lunes',sub:'Upper A · torso completo',ex:[['Press de banca con barra','3 × 6–8','press-de-banca-con-barra.webp','Escápulas atrás, pies firmes y baja al pecho con control.'],['Remo curvado con barra','3 × 6–10','remo-curvado-con-barra.webp','Torso estable, espalda neutra y lleva la barra al abdomen.'],['Press inclinado con mancuernas','3 × 8–12','press-inclinado-con-mancuernas.webp','Banco moderado, pecho alto y controla la bajada.'],['Jalón al pecho agarre ancho','3 × 8–12','jalon-al-pecho-agarre-ancho.webp','Pecho alto, hombros abajo y lleva la barra al pecho superior.'],['Elevación lateral con mancuernas','3 × 12–20','elevacion-lateral-con-mancuernas.webp','Sube hasta hombros sin impulso; controla la bajada.'],['Curl alterno con mancuernas','2 × 8–12','curl-alterno-con-mancuernas.webp','Codos pegados y evita balancear el torso.'],['Extensión de tríceps con cuerda','2 × 10–15','extension-de-triceps-con-cuerda.webp','Codos fijos; abre la cuerda al final de la extensión.']]},{key:'lowerA',short:'M',title:'Martes',sub:'Lower A · pierna completa',ex:[['Sentadilla hack','3 × 6–10','sentadilla-hack.webp','Espalda apoyada, rodillas alineadas y baja con control.'],['Curl femoral tumbado','4 × 8–12','curl-femoral-tumbado.webp','Cadera pegada al banco y aprieta femorales arriba.'],['Prensa inclinada 45°','3 × 10–15','prensa-inclinada-45.webp','Espalda apoyada, baja con control y no bloquees rodillas.'],['Extensión de cuádriceps','2 × 12–15','extension-de-cuadriceps.webp','Pausa arriba y baja lentamente sin soltar el peso.'],['Abducción de cadera en máquina','3 × 15–20','abduccion-de-cadera-en-maquina.webp','Pelvis estable; abre con control y aprieta glúteo medio.'],['Gemelos en prensa 45°','4 × 10–15','prensa-inclinada-45.webp','Solo mueve el tobillo: estira abajo y pausa arriba.']]},{key:'push',short:'J',title:'Jueves',sub:'Push · pecho, hombro y tríceps',ex:[['Press inclinado con barra','3 × 6–10','press-inclinado-con-barra.webp','Escápulas atrás y baja la barra al pecho superior.'],['Press de hombro con mancuernas','3 × 8–10','press-de-hombro-con-mancuernas.webp','Core firme y evita arquear la zona lumbar.'],['Fondos enfocados a pecho','2 × 8–12','fondos-enfocados-a-pecho.webp','Inclina ligeramente el torso y baja con hombros controlados.'],['Cruce de poleas medio','2 × 10–15','cruce-de-poleas-medio.webp','Codos suaves y junta las manos sin perder tensión.'],['Elevación lateral con mancuernas','3 × 12–20','elevacion-lateral-con-mancuernas.webp','Sube limpio hasta hombros y evita encoger trapecios.'],['Extensión de tríceps con cuerda','3 × 10–15','extension-de-triceps-con-cuerda.webp','Mantén los codos pegados y extiende por completo.']]},{key:'pull',short:'V',title:'Viernes',sub:'Pull · espalda, deltoide posterior y bíceps',ex:[['Jalón al pecho agarre neutro','3 × 6–10','jalon-al-pecho-agarre-neutro.webp','Tira con los codos hacia abajo y evita balancearte.'],['Remo Seal','3 × 8–12','remo-seal.webp','Pecho apoyado y lleva los codos atrás sin encoger hombros.'],['Remo sentado en polea agarre neutro','2 × 10–12','remo-sentado-en-polea-agarre-neutro.webp','Pecho alto y lleva el agarre al abdomen.'],['Face pull','3 × 12–20','face-pull.webp','Tira hacia la cara con codos altos y aprieta atrás.'],['Curl Scott con barra EZ','3 × 8–12','curl-scott-con-barra-ez.webp','Brazo pegado al banco y baja lento sin despegar el codo.'],['Curl alterno con mancuernas','2 × 10–12','curl-alterno-con-mancuernas.webp','Sin impulso; aprieta arriba y controla la bajada.']]},{key:'lowerB',short:'S',title:'Sábado',sub:'Lower B · segundo estímulo de pierna',ex:[['Prensa inclinada 45°','3 × 8–12','prensa-inclinada-45.webp','Usa rango cómodo y empuja con toda la planta del pie.'],['Curl femoral tumbado','4 × 10–15','curl-femoral-tumbado.webp','Mantén la pelvis apoyada y controla cada repetición.'],['Sentadilla hack','3 × 10–12','sentadilla-hack.webp','Baja profundo sin perder apoyo ni alineación de rodillas.'],['Extensión de cuádriceps','2 × 12–15','extension-de-cuadriceps.webp','Aprieta arriba un instante y baja lento.'],['Abducción de cadera en máquina','3 × 15–20','abduccion-de-cadera-en-maquina.webp','Abre desde la cadera sin mover el tronco.'],['Gemelos en prensa 45°','4 × 12–20','prensa-inclinada-45.webp','Recorrido completo: talón abajo, pausa fuerte arriba.']]}];const STORAGE='vfit-rutina-5dias-v1';let state={week:1,day:0,data:{}};try{state={...state,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){}const week=document.getElementById('week'),days=document.getElementById('days'),list=document.getElementById('list'),saved=document.getElementById('saved'),modal=document.getElementById('modal'),modalImg=document.getElementById('modalImg'),modalName=document.getElementById('modalName');for(let i=1;i<=8;i++){let o=document.createElement('option');o.value=i;o.textContent=i;week.appendChild(o)}week.value=state.week;DAYS.forEach((d,i)=>{let b=document.createElement('button');b.textContent=d.short;b.onclick=()=>{state.day=i;save(false);render()};days.appendChild(b)});function save(f=true){localStorage.setItem(STORAGE,JSON.stringify(state));if(f){saved.classList.add('show');clearTimeout(save.t);save.t=setTimeout(()=>saved.classList.remove('show'),600)}}function keyFor(d,e){return `${d}|w${state.week}|${e}`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function zoom(src,name){modalImg.src=src;modalName.textContent=name;modal.classList.add('show');document.body.style.overflow='hidden'}function closeZoom(){modal.classList.remove('show');document.body.style.overflow='';modalImg.src=''}document.getElementById('close').onclick=closeZoom;modal.onclick=e=>{if(e.target===modal)closeZoom()};function render(){let d=DAYS[state.day]||DAYS[0];[...days.children].forEach((b,i)=>b.classList.toggle('active',i===state.day));dayTitle.textContent=d.title;daySub.textContent=d.sub;list.innerHTML='';d.ex.forEach(([name,target,file,cue],idx)=>{let k=keyFor(d.key,idx),v=state.data[k]||{},src=P+file+V,el=document.createElement('section');el.className='exercise';el.innerHTML=`<button class="photoBtn" type="button"><img src="${src}" alt="${esc(name)}" loading="lazy"><span class="zoom">AMPLIAR</span></button><div class="body"><div class="exTop"><div class="exName">${name}</div><div class="target">${target}</div></div><div class="cue">${cue}</div><div class="fields"><input data-k="${k}" data-f="kg" value="${esc(v.kg||'')}" inputmode="decimal" placeholder="Peso (kg)"><input data-k="${k}" data-f="reps" value="${esc(v.reps||'')}" placeholder="Reps: 8-8-7"></div></div>`;el.querySelector('.photoBtn').onclick=()=>zoom(src,name);list.appendChild(el)});list.querySelectorAll('input').forEach(i=>i.addEventListener('input',e=>{let k=e.target.dataset.k,f=e.target.dataset.f;state.data[k]=state.data[k]||{};state.data[k][f]=e.target.value;save()}));window.scrollTo({top:0,behavior:'instant'})}week.onchange=()=>{state.week=Number(week.value);save(false);render()};render();</script></body></html>
