<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buddy English – habla con tu robotcito</title>
<style>
:root{--bg:#0f1b2d;--card:#182942;--ink:#eef4ff;--mute:#9db2d1;--acc:#3ddc97;--acc2:#5aa9ff;--warn:#ffcf5c;--bad:#ff7a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=text]{background:#10213a;color:var(--ink);border:1px solid #2b4268;border-radius:12px;padding:11px 12px;font-size:16px}
select{flex:1;min-width:120px}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;color:#06231a;background:var(--acc);font-weight:700}
button.sec{background:#243a5c;color:var(--ink)}
button:disabled{opacity:.5}
#start{width:100%;font-size:18px;padding:16px}
.steps{margin:0;padding-left:20px;color:var(--mute);font-size:14px}
.steps b{color:var(--ink)}
/* robot */
.stage{text-align:center}
.robot{width:150px;height:150px;margin:0 auto;display:block;transition:transform .2s}
.robot .mouth{transform-origin:75px 108px;transition:transform .1s}
.robot.speaking .mouth{animation:talk .28s infinite alternate}
.robot.speaking{animation:bob .6s infinite alternate ease-in-out}
.robot.listening .eye{fill:var(--acc)}
.robot.listening .ear{animation:pulse .8s infinite alternate}
.robot.thinking .ant{animation:blink .5s infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.7)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
@keyframes blink{from{fill:#ffcf5c}to{fill:#ff7a7a}}
.status{font-size:14px;color:var(--mute);min-height:20px;margin-top:2px}
.todo{background:#10213a;border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:10px;text-align:left;font-size:15px}
.todo small{display:block;color:var(--mute)}
.todo .say{color:var(--warn);font-weight:700}
/* chat */
#log{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.b{padding:9px 12px;border-radius:14px;max-width:88%;font-size:15px}
.b.bot{background:#21406b;align-self:flex-start}
.b.me{background:#1f6b53;align-self:flex-end}
.b .es{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.b .fix{display:block;color:var(--warn);font-size:13px;margin-top:3px}
.mic{width:86px;height:86px;border-radius:50%;font-size:34px;padding:0;display:block;margin:6px auto;box-shadow:0 0 0 0 rgba(61,220,151,.5)}
.mic.on{background:var(--bad);animation:ring 1.1s infinite}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(255,122,122,0)}}
.hide{display:none!important}
.tiny{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Buddy English</h1>
  <div class="sub">Habla en inglés con tu robotcito. Él te escucha, te responde en voz alta y te dice qué hacer.</div>

  <div class="card" id="setup">
    <div class="row" style="margin-bottom:10px">
      <select id="scn"></select>
      <select id="lvl">
        <option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>C2</option>
      </select>
    </div>
    <ol class="steps">
      <li>Pulsa <b>Empezar</b> y el robot te saluda en inglés.</li>
      <li>Toca el <b>micrófono 🎤</b> y di tu respuesta (o escríbela).</li>
      <li>El robot te contesta y te corrige. Abajo siempre verás <b>qué decir</b>.</li>
    </ol>
    <button id="start" style="margin-top:12px">▶ Empezar</button>
  </div>

  <div class="card stage hide" id="game">
    <svg id="robot" class="robot" viewBox="0 0 150 150" aria-label="Robot">
      <circle class="ant" cx="75" cy="14" r="6" fill="#ffcf5c"/>
      <rect x="72" y="18" width="6" height="16" fill="#9db2d1"/>
      <rect x="22" y="34" width="106" height="92" rx="24" fill="#5aa9ff"/>
      <rect class="ear" x="12" y="66" width="12" height="28" rx="5" fill="#9db2d1"/>
      <rect class="ear" x="126" y="66" width="12" height="28" rx="5" fill="#9db2d1"/>
      <rect x="34" y="48" width="82" height="48" rx="14" fill="#0f1b2d"/>
      <circle class="eye" cx="56" cy="70" r="9" fill="#eef4ff"/>
      <circle class="eye" cx="94" cy="70" r="9" fill="#eef4ff"/>
      <ellipse class="mouth" cx="75" cy="108" rx="16" ry="5" fill="#0f1b2d"/>
    </svg>
    <div class="status" id="status"></div>
    <div id="log" aria-live="polite"></div>
    <div class="todo" id="todo"></div>
    <button class="mic" id="mic" aria-label="Hablar">🎤</button>
    <div class="row" style="margin-top:6px">
      <input type="text" id="txt" placeholder="…o escribe en inglés" style="flex:1;min-width:0" autocomplete="off" autocapitalize="sentences">
      <button id="send">Enviar</button>
    </div>
    <div class="row" style="margin-top:10px;justify-content:center">
      <button class="sec" id="again">🔁 Repetir</button>
      <button class="sec" id="slow">🐢 Más lento</button>
      <button class="sec" id="end">⏹ Terminar</button>
    </div>
    <div class="tiny" id="mode"></div>
  </div>
</div>

<script>
// ---------- Escenarios (modo guiado, funciona sin internet ni IA) ----------
const SCEN = {
  restaurant:{name:"🍽️ Restaurante",ai:"You are a waiter at a restaurant and the student is the customer.",steps:[
    {say:"Welcome! Table for how many people?",es:"Bienvenido. ¿Mesa para cuántas personas?",model:"A table for two, please.",kw:["table","one","two","three","four","for","people"]},
    {say:"Great. What would you like to drink?",es:"Genial. ¿Qué le gustaría beber?",model:"I would like a glass of water, please.",kw:["water","juice","beer","wine","coffee","coke","drink","like"]},
    {say:"Perfect. And what would you like to eat?",es:"Perfecto. ¿Y qué le gustaría comer?",model:"I would like the chicken with rice, please.",kw:["chicken","fish","steak","pasta","salad","pizza","burger","rice","like","have","eat"]},
    {say:"Excellent choice! Do you have any allergies?",es:"¡Buena elección! ¿Tiene alguna alergia?",model:"No, I don't have any allergies.",kw:["no","allerg","nuts","gluten","lactose","not"]},
    {say:"Anything else for you?",es:"¿Algo más?",model:"Could I have the bill, please?",kw:["bill","check","could","please","thank","no"]}]},
  gym:{name:"🏋️ Gimnasio",ai:"You are a friendly gym receptionist and the student is a new member.",steps:[
    {say:"Hi! Welcome to the gym. How can I help you?",es:"¡Hola! Bienvenido al gimnasio. ¿En qué puedo ayudarte?",model:"I would like to sign up for a membership.",kw:["membership","sign","join","member","like","want"]},
    {say:"Sure. What is your goal?",es:"Claro. ¿Cuál es tu objetivo?",model:"I want to build muscle and lose weight.",kw:["muscle","weight","fit","strong","lose","build","goal","want"]},
    {say:"Nice! How many days a week can you train?",es:"¡Bien! ¿Cuántos días a la semana puedes entrenar?",model:"I can train five days a week.",kw:["day","days","week","five","four","three","six","train"]},
    {say:"Great. Do you need a personal trainer?",es:"Genial. ¿Necesitas un entrenador personal?",model:"Yes, please. How much does it cost?",kw:["yes","no","trainer","cost","much","price","please"]}]},
  travel:{name:"✈️ Viaje / Aeropuerto",ai:"You are an airport check-in agent and the student is a traveler.",steps:[
    {say:"Good morning! Passport, please. Where are you flying to?",es:"Buenos días. Pasaporte, por favor. ¿A dónde vuelas?",model:"I'm flying to London.",kw:["flying","going","london","madrid","tokyo","to","fly","travel"]},
    {say:"Do you have any bags to check in?",es:"¿Tienes maletas para facturar?",model:"Yes, I have one suitcase.",kw:["bag","suitcase","one","two","yes","no","luggage"]},
    {say:"Would you like a window or an aisle seat?",es:"¿Prefieres ventana o pasillo?",model:"I would like a window seat, please.",kw:["window","aisle","seat","like","prefer"]},
    {say:"Here is your boarding pass. Your gate is B12.",es:"Aquí tienes tu tarjeta de embarque. Tu puerta es la B12.",model:"Thank you. What time does boarding start?",kw:["thank","time","boarding","gate","when","what"]}]},
  interview:{name:"💼 Entrevista de trabajo",ai:"You are a job interviewer and the student is the candidate.",steps:[
    {say:"Hello! Please, tell me about yourself.",es:"Hola. Cuéntame sobre ti.",model:"My name is Víctor and I work in a restaurant in Valencia.",kw:["name","work","am","i'm","years","live","from"]},
    {say:"Interesting. What are your main strengths?",es:"Interesante. ¿Cuáles son tus puntos fuertes?",model:"I am hard-working and I like teamwork.",kw:["strong","hard","team","good","work","responsible","like","am"]},
    {say:"Why do you want this job?",es:"¿Por qué quieres este trabajo?",model:"I want to learn and grow in my career.",kw:["want","learn","grow","because","career","experience","like"]},
    {say:"Do you have any questions for me?",es:"¿Tienes alguna pregunta para mí?",model:"Yes. What are the working hours?",kw:["what","when","how","hours","salary","yes","no"]}]},
  chat:{name:"💬 Charla libre",endless:true,ai:"You have a relaxed free conversation about daily life, hobbies, food and travel.",steps:[
    {say:"Hi! I'm Buddy. How are you today?",es:"¡Hola! Soy Buddy. ¿Cómo estás hoy?",model:"I'm fine, thank you. And you?",kw:[]},
    {say:"What do you usually do on weekends?",es:"¿Qué sueles hacer los fines de semana?",model:"I usually go to the gym and meet my friends.",kw:[]},
    {say:"That sounds fun! What is your favorite food?",es:"¡Suena divertido! ¿Cuál es tu comida favorita?",model:"My favorite food is pizza.",kw:[]},
    {say:"Where would you like to travel next?",es:"¿A dónde te gustaría viajar?",model:"I would like to travel to Japan.",kw:[]},
    {say:"What do you do for work?",es:"¿A qué te dedicas?",model:"I work in a restaurant in Valencia.",kw:[]},
    {say:"What time do you wake up in the morning?",es:"¿A qué hora te despiertas por la mañana?",model:"I wake up at seven o'clock.",kw:[]},
    {say:"Do you like music? What kind?",es:"¿Te gusta la música? ¿De qué tipo?",model:"Yes, I love Afro House music.",kw:[]},
    {say:"Tell me about your family.",es:"Háblame de tu familia.",model:"I have a son and he lives in London.",kw:[]},
    {say:"What is your favorite sport?",es:"¿Cuál es tu deporte favorito?",model:"I like going to the gym and playing tennis.",kw:[]},
    {say:"What did you do yesterday?",es:"¿Qué hiciste ayer?",model:"Yesterday I worked and then I went to the gym.",kw:[]},
    {say:"What are your plans for tomorrow?",es:"¿Qué planes tienes para mañana?",model:"Tomorrow I am going to study English.",kw:[]},
    {say:"How is the weather today in Valencia?",es:"¿Cómo está el tiempo hoy en Valencia?",model:"It is sunny and a little cold.",kw:[]},
    {say:"What is your dream for the future?",es:"¿Cuál es tu sueño para el futuro?",model:"I want to open my own business.",kw:[]},
    {say:"What do you like to cook at home?",es:"¿Qué te gusta cocinar en casa?",model:"I like to cook pasta and chicken.",kw:[]},
    {say:"Do you prefer the beach or the mountains?",es:"¿Prefieres la playa o la montaña?",model:"I prefer the beach because I love the sea.",kw:[]},
    {say:"What was the best trip of your life?",es:"¿Cuál fue el mejor viaje de tu vida?",model:"My best trip was to Bali.",kw:[]},
    {say:"What is your favorite movie or series?",es:"¿Cuál es tu película o serie favorita?",model:"My favorite series is a very good drama.",kw:[]},
    {say:"Why are you learning English?",es:"¿Por qué estás aprendiendo inglés?",model:"I am learning English to travel and to work.",kw:[]},
    {say:"What do you do to relax?",es:"¿Qué haces para relajarte?",model:"I listen to music and I walk by the sea.",kw:[]},
    {say:"What is the hardest thing about English for you?",es:"¿Qué es lo más difícil del inglés para ti?",model:"Pronunciation is the hardest thing for me.",kw:[]}]}
};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scn=$('scn');
for(const k in SCEN){const o=document.createElement('option');o.value=k;o.textContent=SCEN[k].name;scn.appendChild(o);}

// ---------- Capacidades (se activan solas si existen) ----------
let TTS=null,DICT=null,SAMPLE=null,SR=null;
(async()=>{
  try{ if(window.claude){ TTS=await claude.use('tts'); DICT=await claude.use('dictation'); SAMPLE=await claude.use('sample'); } }catch(e){}
  SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
  updateMode();
})();
function updateMode(){
  const parts=[];
  parts.push(SAMPLE?'Respuestas con IA':'Modo guiado');
  parts.push((DICT||SR)?'micrófono ✔':'sin micrófono (escribe)');
  parts.push((TTS||window.speechSynthesis)?'voz ✔':'sin voz');
  $('mode').textContent=parts.join(' · ');
  if(!(DICT||SR)) $('mic').classList.add('hide');
}

// ---------- Estado ----------
let S=null,speakRate=1,busy=false,lastSay='',speakId=0;
const robot=$('robot');
function setR(c){robot.classList.remove('speaking','listening','thinking');if(c)robot.classList.add(c);}
function status(t){$('status').textContent=t||'';}
function bubble(who,en,extra){
  const d=document.createElement('div');d.className='b '+who;d.textContent=en;
  if(extra&&extra.es){const s=document.createElement('span');s.className='es';s.textContent='🇪🇸 '+extra.es;d.appendChild(s);}
  if(extra&&extra.fix){const s=document.createElement('span');s.className='fix';s.textContent='✏️ '+extra.fix;d.appendChild(s);}
  $('log').appendChild(d);$('log').scrollTop=1e6;
}
function todo(html){$('todo').innerHTML=html;}
const rateFor=()=>({A1:.8,A2:.88,B1:.95,B2:1,C1:1.05,C2:1.1}[$('lvl').value]*speakRate);

// ---------- Voz del robot ----------
function speak(text){
  lastSay=text;setR('speaking');const my=++speakId;
  return new Promise(async res=>{
    let timer=null,fin=false;
    const done=()=>{if(fin)return;fin=true;clearTimeout(timer);if(my===speakId){setR('');}setTimeout(res,400);};
    if(TTS){try{await TTS.speak(text,{language:'en',rate:Math.min(1.5,Math.max(.7,rateFor()))});return done();}catch(e){}}
    if(window.speechSynthesis){
      try{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Math.min(1.2,rateFor());
        const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
        if(v)u.voice=v;
        u.onend=done;u.onerror=done;speechSynthesis.speak(u);
        timer=setTimeout(()=>{try{speechSynthesis.cancel();}catch(e){}done();},Math.max(6000,text.length*180));return;
      }catch(e){}
    }
    setTimeout(done,Math.min(3500,text.length*55));
  });
}

// ---------- Micrófono ----------
let listening=false,recog=null;
function micClick(){
  if(busy)return;
  try{speechSynthesis.cancel();}catch(e){}
  if(listening){stopListen();return;}
  listening=true;$('mic').classList.add('on');setR('listening');status('🎧 Te escucho… habla en inglés');
  if(DICT){
    let got='';
    DICT.onPartial(({text})=>{$('txt').value=text;});
    DICT.onFinal(({text})=>{got=(got+' '+text).trim();$('txt').value=got;});
    DICT.onState(({state})=>{ if(state==='idle'&&listening){listening=false;endListenUI();if(got)submit(got);} });
    DICT.start().catch(e=>{listening=false;endListenUI();status('No pude abrir el micrófono. Escribe tu respuesta ✍️');});
    return;
  }
  if(SR){
    try{if(recog){recog.onresult=recog.onerror=recog.onend=null;recog.abort();}}catch(e){}
    recog=null;
    // iOS: tras la voz del robot el audio tarda un momento en volver al micrófono
    setTimeout(()=>{
      if(!listening)return;
      try{
        const r=new SR();recog=r;r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
        let final='',started=false;
        const watchdog=setTimeout(()=>{if(!started&&recog===r&&listening){try{r.abort();}catch(e){}listening=false;endListenUI();status('No pude activar el micrófono. Toca 🎤 otra vez.');}},4000);
        r.onstart=()=>{started=true;clearTimeout(watchdog);};
        r.onresult=e=>{started=true;let t='';for(const x of e.results){t+=x[0].transcript;if(x.isFinal){final=t;r._conf=x[0].confidence;}}final=final||'';$('txt').value=t;r._last=t;};
        r.onerror=e=>{clearTimeout(watchdog);if(recog!==r)return;listening=false;endListenUI();
          status(e.error==='not-allowed'?'Permite el micrófono en el navegador, o escribe ✍️':(e.error==='no-speech'||e.error==='aborted')?'No te oí. Toca 🎤 otra vez.':'No te oí bien. Prueba otra vez o escribe ✍️');};
        r.onend=()=>{clearTimeout(watchdog);if(recog!==r)return;if(listening){listening=false;endListenUI();const t=final||r._last||$('txt').value;if(t.trim())submit(t,r._conf);else status('No te oí. Toca 🎤 otra vez.');}};
        r.start();
      }catch(e){listening=false;endListenUI();status('Escribe tu respuesta ✍️');}
    },350);
  }
}
function endListenUI(){$('mic').classList.remove('on');if(!busy)setR('');}
async function stopListen(){
  if(DICT){try{await DICT.stop();}catch(e){}}
  if(recog){try{recog.stop();}catch(e){}}
  if(DICT){listening=false;endListenUI();const t=$('txt').value.trim();if(t)submit(t);}
}

// ---------- Lógica de conversación ----------
function norm(s){return s.toLowerCase().replace(/[^a-z' ]/g,' ');}
function hits(text,kw){const t=' '+norm(text)+' ';return kw.length===0?true:kw.some(k=>t.includes(k));}
const PRAISE=["Great job! 🎉","Perfect! 👏","Nice one! ⭐","Very good! 💪","Excellent! 🚀"];

async function begin(){
  S={key:scn.value,i:0,tries:0,hist:[],ai:!!SAMPLE};
  if(SCEN[S.key].endless) S.pool=makePool(true);
  $('setup').classList.add('hide');$('game').classList.remove('hide');$('log').innerHTML='';updateMode();
  if(S.ai) await aiTurn('[START]'); else await guidedAsk();
}
function makePool(first){const st=SCEN.chat.steps,r=st.slice(1);for(let j=r.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[r[j],r[k]]=[r[k],r[j]];}return first?[st[0],...r]:r;}
const curStep=()=>S.pool?S.pool[S.i%S.pool.length]:SCEN[S.key].steps[S.i];
async function guidedAsk(){
  const st=curStep();
  bubble('bot',st.say,{es:st.es});
  todo('<span class="say">Tu turno:</span> responde al robot.<small>Puedes decir algo como: «'+st.model+'»</small>');
  busy=true;status('🤖 El robot habla…');await speak(st.say);busy=false;status('Toca 🎤 y responde');
}
async function submit(text,conf){
  text=(text||$('txt').value).trim();if(!text||busy)return;$('txt').value='';
  bubble('me',text);
  if(S.ai) return aiTurn(text);
  if(S.pool) return chatTurn(text,conf);
  const st=SCEN[S.key].steps[S.i];busy=true;setR('thinking');status('🤖 Pensando…');
  await new Promise(r=>setTimeout(r,500));
  if(hits(text,st.kw)||S.tries>=1){
    const ok=hits(text,st.kw);
    const msg=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"Good try! A natural way to say it is: "+st.model;
    bubble('bot',msg,ok?{fix:'Forma natural: '+st.model}:{});
    await speak(msg);
    S.i++;S.tries=0;busy=false;
    if(S.i>=SCEN[S.key].steps.length){
      const more="That was awesome! Let's keep talking. Tell me more!";
      bubble('bot',more,{es:'¡Increíble! Sigamos charlando. Tú decides cuándo terminar con «Terminar».'});
      S.pool=makePool(false);S.i=0;busy=true;await speak(more);busy=false;return guidedAsk();
    }
    return guidedAsk();
  }
  S.tries++;
  const msg="Almost! Try again. You can say: "+st.model;
  bubble('bot',msg,{es:'Casi. Inténtalo otra vez, di: «'+st.model+'»'});
  todo('<span class="say">Repite así:</span> «'+st.model+'»<small>Toca 🎤 y dilo en voz alta.</small>');
  await speak(msg);busy=false;status('Toca 🎤 y dilo otra vez');
}

// ---------- Charla libre sin fin: solo termina cuando tú pulses «Terminar» ----------
const ES_WORDS=new Set("yo tu el la los las un una que como esta estoy estas bien muy mal hola gracias quiero me te se mi mis pero porque por para con sin de en es son soy tengo tiene hago hace trabajo vivo vivir gusta gustan mucho poco si no y o a al del lo le les nos nuestro buenos dias noches tardes bueno bueno pues entonces ahora hoy ayer mañana".split(' '));
const FIXES=[
  [/\bi am agree\b/i,"I agree"],[/\bi have (\d+) years?( old)?\b/i,"I am $1 years old"],
  [/\bi no (like|have|want|know|speak|understand)\b/i,"I don't $1"],[/\b(he|she|it) have\b/i,"$1 has"],
  [/\bmore better\b/i,"better"],[/\bi want go\b/i,"I want to go"],[/\bi very like\b/i,"I really like"],
  [/\bi like (go|play|eat|travel|cook|run) /i,"I like to $1 "],[/\bmy name are\b/i,"my name is"],[/\bi am go\b/i,"I am going"],
  [/\bi (am )?live in the\b/i,"I live in the"],[/\bdepend of\b/i,"depend on"]
];
function quickFix(t){let o=t,ch=false;for(const[r,x]of FIXES){if(r.test(o)){o=o.replace(r,x);ch=true;}}
  if(!ch)return '';o=o.trim();return o.charAt(0).toUpperCase()+o.slice(1)+(/[.!?]$/.test(o)?'':'.');}
function looksSpanish(t){const w=norm(t).split(/\s+/).filter(Boolean);if(!w.length)return false;
  return w.filter(x=>ES_WORDS.has(x)||/[áéíóúñ]/.test(x)).length/w.length>=.4;}
const COMMENTS=["Nice! 👏","Good! 💪","I see! ⭐","Cool! 🙂","Great! 🎉","Interesting! 🤔"];
async function chatTurn(text,conf){
  busy=true;setR('thinking');status('🤖 Pensando…');
  await new Promise(r=>setTimeout(r,400));
  const st=curStep();
  // 1) Habló en español -> pedirle que lo diga en inglés
  if(looksSpanish(text)){
    const msg="Let's try in English! You can say: "+st.model;
    bubble('bot',msg,{es:'Dilo en inglés, por ejemplo: «'+st.model+'»'});
    todo('<span class="say">Repite así:</span> «'+esc(st.model)+'»<small>Toca 🎤 y dilo en inglés.</small>');
    await speak(msg);busy=false;status('Toca 🎤 y responde en inglés');return;
  }
  // 2) Pronunciación: si el reconocedor no te entendió bien, repite despacio
  if(conf>0&&conf<.65&&S.tries<1){
    S.tries++;
    const msg="I didn't catch that clearly. Listen and say it again slowly: "+text;
    bubble('bot',msg,{es:'No te entendí bien. Escucha y repítelo despacio y claro.'});
    todo('<span class="say">Pronunciación:</span> repite despacio<small>«'+esc(text)+'»</small>');
    const old=speakRate;speakRate=Math.min(speakRate,.75);await speak(msg);speakRate=old;
    busy=false;status('Toca 🎤 y repítelo despacio');return;
  }
  // 3) Corrección de gramática + siguiente pregunta (nunca se despide)
  const fix=quickFix(text);S.tries=0;
  const c=COMMENTS[Math.floor(Math.random()*COMMENTS.length)];
  if(fix){const m=c+" A more natural way to say it: "+fix;bubble('bot',m,{es:'Forma más natural: '+fix});await speak(m);}
  else{bubble('bot',c);await speak(c);}
  S.i++;busy=false;return guidedAsk();
}

// ---------- Modo IA (si la plataforma lo permite) ----------
async function aiTurn(userText){
  busy=true;setR('thinking');status('🤖 Pensando…');
  const sc=SCEN[S.key];
  const sys=`You are Buddy, a friendly robot English tutor. Role-play: ${sc.ai}
Student level (CEFR): ${$('lvl').value}. Use vocabulary and grammar suited to that level.
Keep every turn SHORT (max 2 sentences) and always end with a question so the student keeps talking.
Reply in EXACTLY this format, nothing else:
EN: <your spoken reply in English>
ES: <one short Spanish line telling the student what to do or say next, with an example sentence in English>
FIX: <only if the student's last message had a mistake: the corrected English sentence plus a 5-word Spanish reason; otherwise write NONE>
If the student's message is [START], greet them and ask the first question of the role-play.`;
  S.hist.push({role:'user',content:userText});
  try{
    const r=await SAMPLE([{role:'user',content:sys+'\n\nConversation so far will follow.'},{role:'assistant',content:'EN: Ready!\nES: Listo.\nFIX: NONE'},...S.hist],{cache:false,modelTier:'quick'});
    const t=r.text||'';
    const en=(t.match(/EN:\s*([\s\S]*?)\n\s*ES:/)||[])[1]?.trim()||t.trim();
    const es=(t.match(/ES:\s*([\s\S]*?)(\n\s*FIX:|$)/)||[])[1]?.trim()||'';
    let fix=(t.match(/FIX:\s*([\s\S]*)$/)||[])[1]?.trim()||'';if(/^none/i.test(fix))fix='';
    S.hist.push({role:'assistant',content:t});
    bubble('bot',en,{es,fix});
    todo('<span class="say">Tu turno:</span> responde al robot.<small>'+esc(es||'Toca 🎤 y habla en inglés.')+'</small>');
    status('🤖 El robot habla…');await speak(en);busy=false;status('Toca 🎤 y responde');
  }catch(e){
    S.hist.pop();
    S.ai=false;busy=false;setR('');updateMode();$('mode').textContent+=' · IA no disponible, paso a modo guiado';
    S.i=0;S.tries=0;await guidedAsk();
  }
}

// ---------- Botones ----------
$('start').onclick=()=>{if(window.speechSynthesis)try{speechSynthesis.getVoices();}catch(e){}begin();};
$('mic').onclick=micClick;
$('send').onclick=()=>submit();
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
$('again').onclick=()=>{if(lastSay&&!busy){busy=true;speak(lastSay).then(()=>busy=false);}};
$('slow').onclick=()=>{speakRate=speakRate<1?1:.75;$('slow').textContent=speakRate<1?'🐇 Normal':'🐢 Más lento';};
$('end').onclick=()=>{try{TTS&&TTS.stop();}catch(e){}try{speechSynthesis.cancel();}catch(e){}
  listening=false;busy=false;endListenUI();setR('');$('game').classList.add('hide');$('setup').classList.remove('hide');};
