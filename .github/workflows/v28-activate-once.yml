name: V28 Activation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-activate-once.yml'
permissions:
  contents: write
jobs:
  activate-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runtime
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Activate V28 compatibility layer
        run: python scripts/activate-v28.py
      - name: Run account regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-accounts.cjs
      - name: Run adaptive regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-adaptive.cjs
      - name: Run V23 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v23.cjs
      - name: Run V24 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v24.cjs
      - name: Run V25 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v25.cjs
      - name: Run V26 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v26.cjs
      - name: Run V27 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v27.cjs
      - name: Run V28 suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v28.cjs
      - name: Verify activation files
        run: |
          grep -q 'accounts.js?v=28' overrides/index.html
          grep -q 'v28.js?v=28' overrides/index.html
          grep -q "vfit-pro-v28" overrides/sw.js
          grep -q 'schemaVersion:7' overrides/accounts.js
          grep -q 'profile.v28' overrides/accounts.js
          grep -q "type:s.type==='drop'" overrides/index.html
      - name: Commit verified V28 activation
        run: |
          git config user.name 'VFIT QA'
          git config user.email 'actions@users.noreply.github.com'
          git add overrides/index.html overrides/accounts.js overrides/v23.js overrides/sw.js overrides/v28.js scripts/test-v27.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Activate V28 advanced sets after QA'
            git push
          fi
# retry after V28 session-detail rendering fix
