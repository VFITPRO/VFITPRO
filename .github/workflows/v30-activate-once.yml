name: V30 Activation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v30-activate-once.yml'
permissions:
  contents: write
jobs:
  activate-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runtime
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Activate V30 layer
        run: python scripts/activate-v30.py
      - name: Run account regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-accounts.cjs
      - name: Run adaptive regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-adaptive.cjs
      - name: Run V23 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v23.cjs
      - name: Run V24 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v24.cjs
      - name: Run V25 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v25.cjs
      - name: Run V26 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v26.cjs
      - name: Run V27 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v27.cjs
      - name: Run V28 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v28.cjs
      - name: Run V29 regression suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v29.cjs
      - name: Run V30 suite
        env: {VFIT_JSDOM_PATH: '${{ github.workspace }}/node_modules/jsdom'}
        run: node scripts/test-v30.cjs
      - name: Verify activation files
        run: |
          grep -q 'v30.js?v=30' overrides/index.html
          grep -q "vfit-pro-v30" overrides/sw.js
          grep -q "./v30.js?v=30" overrides/sw.js
          grep -q 'schemaVersion:8' overrides/accounts.js
      - name: Commit verified V30 activation
        run: |
          git config user.name 'VFIT QA'
          git config user.email 'actions@users.noreply.github.com'
          git add overrides/index.html overrides/sw.js overrides/v30.js scripts/test-v29.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Activate V30 post-workout summary after QA'
            git push
          fi
# retry after locale-safe volume assertions
