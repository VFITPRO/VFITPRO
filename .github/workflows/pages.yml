name: Publish VFIT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          unzip -q VFIT_PRO_PREMIUM_V14.zip -d public
          cp -R overrides/. public/

          sed -i 's#v49-compat.js?v=[0-9]*#v49-compat.js?v=511#g' public/index.html
          grep -q 'v49-compat.js?v=511' public/index.html
          grep -q "v50-premium-art.js?v=509" public/v49-compat.js
          grep -q 'VFITWorkoutControlsV511' public/v49-compat.js
          grep -q 'Terminar sin guardar' public/v49-compat.js
          grep -q "const VERSION = '?v=509'" public/v50-premium-art.js
          grep -q "'Press de banca': 'Press de banca con barra'" public/v50-premium-art.js
          grep -q "'Extensión de tríceps al frente'" public/v50-premium-art.js
          node --check public/v49-compat.js
          node --check public/v50-premium-art.js
          node --check public/sw.js
          node --check public/v52-simple.js
          grep -q 'v52-simple.js?v=52' public/index.html
          grep -q 'v52-simple.css?v=52' public/index.html

          python - <<'PY'
          from pathlib import Path
          photos = Path('public/assets/exercises/premium')
          anatomy = Path('public/assets/anatomy/premium')
          must_photos = {
              'press-de-banca-con-barra.webp',
              'remo-curvado-con-barra.webp',
              'press-de-hombro-con-mancuernas.webp',
              'sentadilla-hack.webp',
              'extension-de-triceps-con-cuerda.webp',
              'extension-de-triceps-al-frente.webp',
          }
          must_anatomy = {
              'muscle-pectoral-medio.webp',
              'muscle-dorsal-ancho.webp',
              'muscle-biceps-braquial.webp',
              'muscle-triceps-lateral.webp',
              'muscle-triceps-largo.webp',
              'muscle-triceps-medial.webp',
          }
          actual_photos = {p.name for p in photos.glob('*.webp')}
          actual_anatomy = {p.name for p in anatomy.glob('*.webp')}
          missing = (must_photos - actual_photos) | (must_anatomy - actual_anatomy)
          assert not missing, f'Missing premium assets: {sorted(missing)}'
          for path in photos.glob('*.webp'):
              data = path.read_bytes()
              assert len(data) > 100_000, f'Truncated premium photo: {path} ({len(data)} bytes)'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Invalid WebP: {path}'
          for path in anatomy.glob('*.webp'):
              data = path.read_bytes()
              assert len(data) > 50_000, f'Truncated premium anatomy: {path} ({len(data)} bytes)'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Invalid WebP: {path}'
          print('ALL LOCAL PREMIUM WEBP FILES VERIFIED', len(actual_photos), len(actual_anatomy))
          PY

          test -f public/index.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live public VFIT PRO
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' \
            "${BASE}?verify=${GITHUB_SHA}" -o /tmp/index.html
          grep -q 'v49-compat.js?v=511' /tmp/index.html

          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' \
            "${BASE}v49-compat.js?v=511&verify=${GITHUB_SHA}" -o /tmp/v49-compat.js
          grep -q 'VFITWorkoutControlsV511' /tmp/v49-compat.js
          grep -q 'Terminar sin guardar' /tmp/v49-compat.js
          grep -q 'v50-premium-art.js?v=509' /tmp/v49-compat.js

          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' \
            "${BASE}v50-premium-art.js?v=509&verify=${GITHUB_SHA}" -o /tmp/v50-premium-art.js
          grep -q "'Press de banca': 'Press de banca con barra'" /tmp/v50-premium-art.js
          grep -q "'Extensión de tríceps al frente'" /tmp/v50-premium-art.js
          grep -q "'Curl con mancuernas': 'Curl alterno con mancuernas'" /tmp/v50-premium-art.js
          grep -q "'Prensa de piernas': 'Prensa inclinada 45°'" /tmp/v50-premium-art.js

          python - <<'PY'
          from urllib.request import Request, urlopen
          import os, time
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          sha = os.environ['GITHUB_SHA']
          checks = [
              ('assets/exercises/premium/extension-de-triceps-con-cuerda.webp', 100_000),
              ('assets/exercises/premium/extension-de-triceps-al-frente.webp', 100_000),
              ('assets/anatomy/premium/muscle-triceps-lateral.webp', 50_000),
              ('assets/anatomy/premium/muscle-triceps-largo.webp', 50_000),
              ('assets/anatomy/premium/muscle-triceps-medial.webp', 50_000),
              ('assets/anatomy/premium/muscle-biceps-braquial.webp', 50_000),
              ('assets/anatomy/premium/muscle-dorsal-ancho.webp', 50_000),
          ]
          def fetch(url):
              last = None
              for _ in range(8):
                  try:
                      req = Request(url, headers={'Cache-Control':'no-cache','User-Agent':'VFIT-Pages-Smoke-Test'})
                      with urlopen(req, timeout=30) as r:
                          data = r.read()
                          if r.status != 200: raise RuntimeError(f'HTTP {r.status}')
                          return data
                  except Exception as exc:
                      last = exc
                      time.sleep(2)
              raise last
          for path, minimum in checks:
              url = f'{base}{path}?v=509&verify={sha}'
              data = fetch(url)
              assert len(data) > minimum, f'Live asset truncated: {url} ({len(data)} bytes)'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Live asset invalid: {url}'
          print('PUBLIC VFIT PRO V511 WORKOUT FINISH VERIFIED:', base)
          PY
