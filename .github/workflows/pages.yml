name: Publish VFIT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate application
        run: |
          set -euo pipefail
          mkdir -p public
          unzip -q VFIT_PRO_PREMIUM_V14.zip -d public
          cp -R overrides/. public/

          # Force the repaired loader URL in the actually published HTML. This makes
          # old cache entries for v49-compat.js?v=49 impossible to reuse.
          sed -i 's#v49-compat.js?v=49#v49-compat.js?v=504#g' public/index.html
          grep -q 'v49-compat.js?v=504' public/index.html
          grep -q "v50-premium-art.js?v=504" public/v49-compat.js

          node --check public/v49-compat.js
          node --check public/v50-premium-art.js
          node --check public/sw.js

          python - <<'PY'
          from pathlib import Path

          photos = Path('public/assets/exercises/premium')
          anatomy = Path('public/assets/anatomy/premium')
          expected_photos = {
              'press-de-banca-con-barra.webp',
              'press-inclinado-con-barra.webp',
              'press-declinado-con-barra.webp',
              'press-plano-con-mancuernas.webp',
              'press-inclinado-con-mancuernas.webp',
              'press-de-pecho-en-maquina.webp',
              'press-convergente-de-pecho.webp',
              'press-de-banca-en-smith.webp',
              'press-inclinado-en-smith.webp',
              'aperturas-con-mancuernas.webp',
              'aperturas-inclinadas-con-mancuernas.webp',
              'cruce-de-poleas-medio.webp',
              'cruce-de-poleas-de-abajo-arriba.webp',
              'cruce-de-poleas-de-arriba-abajo.webp',
              'pec-deck.webp',
              'fondos-enfocados-a-pecho.webp',
              'flexiones.webp',
              'flexiones-lastradas.webp',
              'press-landmine-unilateral.webp',
              'remo-seal.webp',
              'jalon-al-pecho-agarre-neutro.webp',
              'jalon-al-pecho-agarre-ancho.webp',
              'remo-sentado-en-polea-agarre-neutro.webp',
              'remo-sentado-en-polea-agarre-ancho.webp',
              'remo-en-maquina-convergente.webp',
              'remo-unilateral-en-polea.webp',
          }
          expected_anatomy = {
              'muscle-pectoral-medio.webp',
              'muscle-pectoral-superior.webp',
              'muscle-pectoral-inferior.webp',
              'muscle-pectoral-mayor.webp',
          }

          actual_photos = {p.name for p in photos.glob('*.webp')}
          actual_anatomy = {p.name for p in anatomy.glob('*.webp')}
          missing = (expected_photos - actual_photos) | (expected_anatomy - actual_anatomy)
          assert not missing, f'Missing premium assets: {sorted(missing)}'

          for path in [*photos.glob('*.webp'), *anatomy.glob('*.webp')]:
              data = path.read_bytes()
              assert len(data) > 100_000, f'Truncated premium asset: {path} ({len(data)} bytes)'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Invalid WebP: {path}'
              print(f'OK {path} {len(data)} bytes')
          PY

          test -f public/index.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live public VFIT PRO
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          mkdir -p live-check/photos live-check/anatomy

          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${BASE}?verify=${GITHUB_SHA}" -o live-check/index.html
          grep -q 'v49-compat.js?v=504' live-check/index.html

          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${BASE}v49-compat.js?v=504&verify=${GITHUB_SHA}" -o live-check/v49-compat.js
          grep -q 'v50-premium-art.js?v=504' live-check/v49-compat.js

          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${BASE}v50-premium-art.js?v=504&verify=${GITHUB_SHA}" -o live-check/v50-premium-art.js
          grep -q "'Press de banca con barra'" live-check/v50-premium-art.js
          grep -q "'Flexiones lastradas'" live-check/v50-premium-art.js
          grep -q "'Press landmine unilateral'" live-check/v50-premium-art.js
          grep -q "'Remo unilateral en polea'" live-check/v50-premium-art.js

          python - <<'PY'
          from urllib.request import Request, urlopen
          import os, time

          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          sha = os.environ['GITHUB_SHA']
          photos = [
              'press-de-banca-con-barra.webp','press-inclinado-con-barra.webp','press-declinado-con-barra.webp',
              'press-plano-con-mancuernas.webp','press-inclinado-con-mancuernas.webp','press-de-pecho-en-maquina.webp',
              'press-convergente-de-pecho.webp','press-de-banca-en-smith.webp','press-inclinado-en-smith.webp',
              'aperturas-con-mancuernas.webp','aperturas-inclinadas-con-mancuernas.webp','cruce-de-poleas-medio.webp',
              'cruce-de-poleas-de-abajo-arriba.webp','cruce-de-poleas-de-arriba-abajo.webp','pec-deck.webp',
              'fondos-enfocados-a-pecho.webp','flexiones.webp','flexiones-lastradas.webp','press-landmine-unilateral.webp',
              'remo-seal.webp','jalon-al-pecho-agarre-neutro.webp','jalon-al-pecho-agarre-ancho.webp',
              'remo-sentado-en-polea-agarre-neutro.webp','remo-sentado-en-polea-agarre-ancho.webp',
              'remo-en-maquina-convergente.webp','remo-unilateral-en-polea.webp'
          ]
          anatomy = [
              'muscle-pectoral-medio.webp','muscle-pectoral-superior.webp',
              'muscle-pectoral-inferior.webp','muscle-pectoral-mayor.webp'
          ]

          def fetch(url):
              last = None
              for attempt in range(8):
                  try:
                      req = Request(url, headers={'Cache-Control':'no-cache','User-Agent':'VFIT-Pages-Smoke-Test'})
                      with urlopen(req, timeout=30) as r:
                          data = r.read()
                          if r.status != 200:
                              raise RuntimeError(f'HTTP {r.status}')
                          return data
                  except Exception as exc:
                      last = exc
                      time.sleep(2)
              raise last

          for folder, names in [('assets/exercises/premium', photos), ('assets/anatomy/premium', anatomy)]:
              for name in names:
                  url = f'{base}{folder}/{name}?v=504&verify={sha}'
                  data = fetch(url)
                  assert len(data) > 100_000, f'Live asset truncated: {url} ({len(data)} bytes)'
                  assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'Live asset invalid: {url}'
                  print(f'LIVE OK {name} {len(data)} bytes')
          print('PUBLIC VFIT PRO VERIFIED:', base)
          PY