name: Publish VFIT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract application
        run: |
          set -euo pipefail
          mkdir -p public
          unzip -q VFIT_PRO_PREMIUM_V14.zip -d public
          cp -R overrides/. public/
          for pack in V50_CHEST_1.zip V50_CHEST_2.zip V50_CHEST_3.zip V50_CHEST_4.zip; do
            test -f "$pack"
            unzip -oq "$pack" -d public
          done
          test -f public/index.html
          test -f public/assets/exercises/premium/press-de-banca-con-barra.webp
          test -f public/assets/exercises/premium/flexiones-lastradas.webp
          test -f public/assets/anatomy/premium/muscle-pectoral-medio.webp
          test -f public/assets/anatomy/premium/muscle-pectoral-inferior.webp
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
