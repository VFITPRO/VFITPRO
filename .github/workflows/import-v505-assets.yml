name: Import V505 premium assets
on:
  push:
    branches: [v505-back-assets]
    paths:
      - '.github/workflows/import-v505-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate exact Work asset bundle
        shell: bash
        env:
          ZIP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-d7bc-81f4-83a5-bf81a258392f/raw?se=2026-10-20T01%3A21%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=c3925501-cd6f-5417-b92b-202023761a6f&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T23%3A09%3A07Z&ske=2026-10-20T23%3A09%3A07Z&sks=b&skv=2026-02-06&sig=Av4CK/6su5jbRjRAWazlBLdRD2LEXH0u7y9ULjZdFXQ%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ZIP_URL" -o /tmp/v505-premium-assets.zip
          echo 'ba42cd8e60203463db99d668b414a27594746082be072277dec1ee2f12e28f57  /tmp/v505-premium-assets.zip' | sha256sum -c -
          unzip -oq /tmp/v505-premium-assets.zip -d .
          python - <<'PY'
          from pathlib import Path
          expected = {
            'overrides/assets/exercises/premium/press-landmine-unilateral.webp': 190574,
            'overrides/assets/exercises/premium/remo-curvado-con-barra.webp': 181912,
            'overrides/assets/exercises/premium/remo-unilateral-con-mancuerna.webp': 165440,
            'overrides/assets/anatomy/premium/muscle-press-landmine-unilateral.webp': 55366,
            'overrides/assets/anatomy/premium/muscle-remo-curvado-con-barra.webp': 55892,
            'overrides/assets/anatomy/premium/muscle-remo-unilateral-con-mancuerna.webp': 79876,
            'overrides/assets/anatomy/premium/muscle-remo-sentado-en-polea-agarre-neutro.webp': 83750,
          }
          for name, size in expected.items():
              p=Path(name); d=p.read_bytes()
              assert len(d)==size, (name, len(d), size)
              assert d[:4]==b'RIFF' and d[8:12]==b'WEBP', name
              print('OK', name, len(d))
          PY
      - name: Commit exact assets and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-v505-assets.yml
          git config user.name 'VFITPRO Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified V505 premium exercise assets'
          git push origin HEAD:v505-back-assets
