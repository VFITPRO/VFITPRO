name: V23 Stability QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v23-stability-once.yml'
permissions:
  contents: write
jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test runtime
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Apply V23 stability fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('overrides/v23.js')
          s=p.read_text()
          old="""  function decorateExerciseForSub(){\n    const replacement=subExercise();renderSubstitutionPanel();if(!replacement)return;"""
          new="""  function decorateExerciseForSub(){\n    document.querySelectorAll('.v23SubBadge').forEach(x=>x.remove());\n    const replacement=subExercise();renderSubstitutionPanel();if(!replacement)return;"""
          if old not in s:
              raise SystemExit('decorateExerciseForSub patch target not found')
          s=s.replace(old,new,1)
          old="""  finishDay=function(){const day=activeDay,before=progress.sessions;baseFinishDayV23();if(progress.sessions>before){finalizeSubstitutions(day,progress.history[0]);recalcProgress();markDirty();persist();renderProgress();}};"""
          new="""  finishDay=function(){const day=activeDay,before=progress.sessions,recordsBefore={...progress.records};baseFinishDayV23();if(progress.sessions>before){finalizeSubstitutions(day,progress.history[0]);progress.records=recordsBefore;recalcProgress();markDirty();persist();renderProgress();}};"""
          if old not in s:
              raise SystemExit('finishDay patch target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Run account regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-accounts.cjs
      - name: Run adaptive regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-adaptive.cjs
      - name: Run V23 stability suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v23.cjs
      - name: Commit verified fixes
        run: |
          git config user.name 'VFIT QA'
          git config user.email 'actions@users.noreply.github.com'
          git add overrides/v23.js
          if ! git diff --cached --quiet; then
            git commit -m 'Stabilize V23 substitutions after QA'
            git push
          fi
