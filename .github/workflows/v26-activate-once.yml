name: V26 Activation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v26-activate-once.yml'
permissions:
  contents: write
jobs:
  activate-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test runtime
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Activate V26 compatibility layer
        run: |
          python scripts/activate-v26.py
          python scripts/fix-v26-state.py
      - name: Run account regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-accounts.cjs
      - name: Run adaptive regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-adaptive.cjs
      - name: Run V23 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v23.cjs
      - name: Run V24 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v24.cjs
      - name: Run V25 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v25.cjs
      - name: Run V26 suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v26.cjs
      - name: Verify activation files
        run: |
          grep -q 'accounts.js?v=26' overrides/index.html
          grep -q 'v26.js?v=26' overrides/index.html
          grep -q "vfit-pro-v26" overrides/sw.js
          grep -q "./assets/custom-exercise.svg" overrides/sw.js
          grep -q 'schemaVersion:5' overrides/accounts.js
          grep -q 'profile.v26' overrides/accounts.js
      - name: Commit verified V26 activation
        run: |
          git config user.name 'VFIT QA'
          git config user.email 'actions@users.noreply.github.com'
          git add overrides/index.html overrides/accounts.js overrides/sw.js overrides/v26.js
          if ! git diff --cached --quiet; then
            git commit -m 'Activate V26 free program builder after QA'
            git push
          fi
# retry after fresh-account initialization fix
