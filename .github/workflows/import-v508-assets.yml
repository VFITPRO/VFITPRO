name: Import V508 salvaged shoulder assets
on:
  push:
    branches: [v508-shoulder-salvage]
    paths:
      - '.github/workflows/import-v508-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate V508 salvage bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://sdmntprukwest.oaiusercontent.com/files/00000000-d468-8243-927f-76d6b78b3b64/raw?se=2026-10-20T02%3A09%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=b3efd2db-e26b-51a4-a0b7-8baee5eaf2ae&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T22%3A56%3A14Z&ske=2026-10-20T22%3A56%3A14Z&sks=b&skv=2026-02-06&sig=wiUiRm9Hby7o4xvoIySFUu0vG9Phu2zfmkwW7na%2BlQs%3D' \
            -o /tmp/v508-shoulder-salvage.zip
          echo '84e19d7549e4d637d4c4d8ca5da7d8d185a4f0a7b48490eca12c9ccfb83788c1  /tmp/v508-shoulder-salvage.zip' | sha256sum -c -
          rm -rf /tmp/v508 && mkdir -p /tmp/v508
          unzip -oq /tmp/v508-shoulder-salvage.zip -d /tmp/v508
          mkdir -p overrides/assets/exercises/premium overrides/assets/anatomy/premium
          for f in press-arnold.webp face-pull.webp pec-deck-inverso.webp elevacion-lateral-en-polea.webp pajaros-con-mancuernas.webp remo-al-menton.webp; do
            cp "/tmp/v508/$f" "overrides/assets/exercises/premium/$f"
          done
          for f in muscle-deltoides-posterior.webp muscle-deltoides-anterior.webp muscle-deltoides-general.webp muscle-deltoides-trapecio.webp; do
            cp "/tmp/v508/$f" "overrides/assets/anatomy/premium/$f"
          done
          python - <<'PY'
          from pathlib import Path
          expected = {
            'overrides/assets/exercises/premium/elevacion-lateral-en-polea.webp': 449320,
            'overrides/assets/exercises/premium/face-pull.webp': 445606,
            'overrides/assets/exercises/premium/pajaros-con-mancuernas.webp': 448886,
            'overrides/assets/exercises/premium/pec-deck-inverso.webp': 442034,
            'overrides/assets/exercises/premium/press-arnold.webp': 462670,
            'overrides/assets/exercises/premium/remo-al-menton.webp': 528154,
            'overrides/assets/anatomy/premium/muscle-deltoides-anterior.webp': 241264,
            'overrides/assets/anatomy/premium/muscle-deltoides-general.webp': 227326,
            'overrides/assets/anatomy/premium/muscle-deltoides-posterior.webp': 275628,
            'overrides/assets/anatomy/premium/muscle-deltoides-trapecio.webp': 257852,
          }
          for name, size in expected.items():
              data = Path(name).read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', name
              print('OK', name, len(data))
          PY
      - name: Commit V508 assets and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-v508-assets.yml
          git config user.name 'VFITPRO Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import salvaged V508 shoulder assets'
          git push origin HEAD:v508-shoulder-salvage
