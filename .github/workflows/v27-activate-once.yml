name: V27 Activation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-activate-once.yml'
permissions:
  contents: write
jobs:
  activate-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runtime
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Activate V27 compatibility layer
        run: python scripts/activate-v27.py
      - name: Run account regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-accounts.cjs
      - name: Run adaptive regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-adaptive.cjs
      - name: Run V23 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v23.cjs
      - name: Run V24 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v24.cjs
      - name: Run V25 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v25.cjs
      - name: Run V26 regression suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v26.cjs
      - name: Run V27 suite
        env:
          VFIT_JSDOM_PATH: ${{ github.workspace }}/node_modules/jsdom
        run: node scripts/test-v27.cjs
      - name: Verify activation files
        run: |
          grep -q 'accounts.js?v=27' overrides/index.html
          grep -q 'v27.js?v=27' overrides/index.html
          grep -q "vfit-pro-v27" overrides/sw.js
          grep -q 'schemaVersion:6' overrides/accounts.js
          grep -q 'profile.v27' overrides/accounts.js
      - name: Commit verified V27 activation
        run: |
          git config user.name 'VFIT QA'
          git config user.email 'actions@users.noreply.github.com'
          git add overrides/index.html overrides/accounts.js overrides/sw.js overrides/v27.js
          if ! git diff --cached --quiet; then
            git commit -m 'Activate V27 daily experience after QA'
            git push
          fi
