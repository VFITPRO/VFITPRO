name: Import V506 Work assets
on:
  push:
    branches: [v506-work-batch]
    paths:
      - '.tmp-v506/READY'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate V506 asset bundle
        shell: bash
        env:
          ASSET_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-de3c-8246-8227-4d61ef204d84/raw?se=2026-10-20T01%3A06%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=37318b72-a349-5c76-8c14-2ee384dd33c5&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T23%3A09%3A07Z&ske=2026-10-20T23%3A09%3A07Z&sks=b&skv=2026-02-06&sig=if0cqmUro0fKR0ZkAllFHA/mx/hcxM%2Bu4gg41lYmIM4%3D'
        run: |
          set -euo pipefail
          test -f .tmp-v506/READY
          curl --fail --location --retry 3 --retry-delay 2 "$ASSET_URL" -o /tmp/v506-work-assets.zip
          echo 'e5ba7e72489dd1b3d4906df1339511232703653efaf877069cc99e2e9371d999  /tmp/v506-work-assets.zip' | sha256sum -c -
          unzip -oq /tmp/v506-work-assets.zip -d .
          python - <<'PY'
          from pathlib import Path
          expected = {
            'overrides/assets/exercises/premium/press-de-hombro-con-mancuernas.webp':252070,
            'overrides/assets/exercises/premium/elevacion-lateral-con-mancuernas.webp':237716,
            'overrides/assets/exercises/premium/elevacion-frontal-con-mancuernas.webp':254242,
            'overrides/assets/exercises/premium/curl-con-barra-recta.webp':250242,
            'overrides/assets/exercises/premium/curl-alterno-con-mancuernas.webp':269194,
            'overrides/assets/exercises/premium/curl-scott-con-barra-ez.webp':247500,
            'overrides/assets/exercises/premium/extension-de-triceps-con-barra-recta.webp':258642,
            'overrides/assets/exercises/premium/extension-sobre-cabeza-con-mancuerna.webp':234124,
            'overrides/assets/exercises/premium/press-frances-con-barra-ez.webp':230034,
            'overrides/assets/exercises/premium/sentadilla-hack.webp':278676,
            'overrides/assets/exercises/premium/prensa-inclinada-45.webp':166850,
            'overrides/assets/exercises/premium/extension-de-cuadriceps.webp':237794,
            'overrides/assets/exercises/premium/curl-femoral-tumbado.webp':243656,
            'overrides/assets/anatomy/premium/muscle-deltoides-lateral.webp':115584,
            'overrides/assets/anatomy/premium/muscle-biceps-cabeza-corta.webp':199658,
            'overrides/assets/anatomy/premium/muscle-triceps.webp':177200,
            'overrides/assets/anatomy/premium/muscle-cuadriceps.webp':147856,
            'overrides/assets/anatomy/premium/muscle-isquiotibiales.webp':164442,
            'overrides/assets/anatomy/premium/muscle-gluteo-medio.webp':177036,
          }
          for name, size in expected.items():
              p=Path(name); d=p.read_bytes()
              assert len(d)==size, (name, len(d), size)
              assert d[:4]==b'RIFF' and d[8:12]==b'WEBP', name
              print('OK', name, len(d))
          PY
      - name: Commit verified V506 assets and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-v506
          rm -f .github/workflows/import-v506-assets.yml
          git config user.name 'VFITPRO Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified V506 Work visual assets'
          git push origin HEAD:v506-work-batch
