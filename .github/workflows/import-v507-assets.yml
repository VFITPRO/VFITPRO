name: Import V507 reused assets
on:
  push:
    branches: [v507-reuse-assets]
    paths:
      - '.github/workflows/import-v507-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate reused V507 asset bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-4230-8246-ad37-8c877a14a74c/raw?se=2026-10-20T01%3A58%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=8632b07e-fb44-52d4-b630-cc4673f158c4&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T23%3A10%3A19Z&ske=2026-10-20T23%3A10%3A19Z&sks=b&skv=2026-02-06&sig=1wOmBserro07cv/zl15x3v/rpwZCTepd5Ig63wZKgQQ%3D' \
            -o /tmp/v507-reuse-assets.zip
          echo '5034b3f7f0dd8e0772b415593ce5cdf5724c63c2f4b8907be034193ff6087241  /tmp/v507-reuse-assets.zip' | sha256sum -c -
          unzip -oq /tmp/v507-reuse-assets.zip -d .
          python - <<'PY'
          from pathlib import Path
          expected = {
            'overrides/assets/exercises/premium/abduccion-de-cadera-en-maquina.webp': 170954,
            'overrides/assets/exercises/premium/press-de-hombro-en-maquina.webp': 177000,
            'overrides/assets/exercises/premium/press-de-hombro-en-smith.webp': 144452,
            'overrides/assets/exercises/premium/press-militar-con-barra.webp': 172740,
            'overrides/assets/exercises/premium/press-militar-sentado-con-barra.webp': 188248,
          }
          for name, size in expected.items():
              p = Path(name)
              d = p.read_bytes()
              assert len(d) == size, (name, len(d), size)
              assert d[:4] == b'RIFF' and d[8:12] == b'WEBP', name
              print('OK', name, len(d))
          PY
      - name: Commit reused assets and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-v507-assets.yml
          git config user.name 'VFITPRO Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import reused V507 shoulder and hip assets'
          git push origin HEAD:v507-reuse-assets
